name: Preview

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_WORKER: ${{ vars.CLOUDFLARE_WORKER || 'marble-docs' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      openapi-ref: ${{ steps.openapi.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - id: openapi
        env:
          OPENAPI_REF: ${{ vars.OPENAPI_REF }}
        run: |
          bun run openapi:fetch
          echo "ref=$(cat openapi/.ref)" >> "$GITHUB_OUTPUT"

      - run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: wrangler.jsonc
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx --yes wrangler@4.149.0 versions upload \
            --name "$CLOUDFLARE_WORKER" \
            --preview-alias "pr-$PR_NUMBER" \
            --message "PR #$PR_NUMBER ($HEAD_SHA)"

          jq -r 'select(.type == "version-upload") | "alias-url=\(.preview_alias_url // "")\nurl=\(.preview_url // "")"' \
            "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            📘 **Docs preview:** ${{ steps.deploy.outputs.alias-url }}

            This commit (`${{ github.event.pull_request.head.sha }}`): ${{ steps.deploy.outputs.url }}
            API reference from `checkmarble/marble-backend@${{ needs.build.outputs.openapi-ref }}`.
